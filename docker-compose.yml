# Local development only. Production runs on Vercel (see vercel.json).
services:
  backend:
    build: ./backend
    # TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET for IGDB. Copy backend/.env.example
    # to backend/.env and fill them in. Optional so compose still starts without it.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      HOST: 0.0.0.0
      FLASK_DEBUG: "1"
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
